blueprint:
  name: ESPHome Altherma – notify me when an update is available
  description: >-
    Sends a notification to your phone when an ESPHome Altherma board reports a new firmware release
    ("Update Available" turns on). For boards adopted in the ESPHome Device Builder: to update, press
    Install there. Boards installed from the web installer update themselves from the "Firmware Update"
    entity instead.
  domain: automation
  author: skydoy
  source_url: https://github.com/skydoy/ESPHome_Altherma/blob/main/homeassistant/blueprints/esphome_altherma_update_available.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    update_available:
      name: Update Available sensor
      description: The board's "Update Available" entity.
      selector:
        entity:
          filter:
            - integration: esphome
              domain: binary_sensor
              device_class: update
    notify_device:
      name: Phone
      description: The phone to notify (needs the Home Assistant Companion app).
      selector:
        device:
          filter:
            - integration: mobile_app

mode: single

triggers:
  - trigger: state
    entity_id: !input update_available
    from: "off"
    to: "on"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "Altherma firmware update available"
    message: >-
      {{ state_attr(trigger.entity_id, 'friendly_name') | replace(' Update Available', '') }}
      has a new firmware release. Open the ESPHome Device Builder and press Install.
