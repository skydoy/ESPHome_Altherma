# Daikin Altherma(EPRA D_D7 ETSH-X 16P30-50 E_E7 series 14-18kW-ECH2O)
# Converted from the ESPAltherma model definition "Altherma(EPRA D_D7 ETSH-X 16P30-50 E_E7 series 14-18kW-ECH2O).h"
# by raomin and contributors (ESPAltherma project, MIT License).
# Every label from that definition is listed; the 0x00 capability block, conv 151
# placeholders and labels using conversions the hub does not support are left out.
# Not yet confirmed on a real unit: please report your results.
.altherma_base: &altherma_base
  platform: altherma_hub
  altherma_hub_id: altherma_hub_1

.temp: &temp
  <<: *altherma_base
  device_class: temperature
  unit_of_measurement: "°C"
  state_class: measurement
  accuracy_decimals: 1

.pressure: &pressure
  <<: *altherma_base
  device_class: pressure
  unit_of_measurement: "bar"
  state_class: measurement
  accuracy_decimals: 2

.freq: &freq
  <<: *altherma_base
  unit_of_measurement: "rps"
  state_class: measurement
  accuracy_decimals: 0

.current: &current
  <<: *altherma_base
  device_class: current
  unit_of_measurement: "A"
  state_class: measurement
  accuracy_decimals: 1

.binary: &binary
  <<: *altherma_base

.text: &text
  <<: *altherma_base

.plain: &plain
  <<: *altherma_base
  state_class: measurement

