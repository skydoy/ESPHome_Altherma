# Placeholder values for the prebuilt web-installer firmware ONLY. Never put real secrets here.
# installer/esphome-altherma-m5stack.installer.yaml includes
# ../boards/esphome-altherma-m5stack.yaml, which uses !secret. ESPHome looks for these in a
# secrets.yaml next to that file first (your own, git-ignored ../boards/secrets.yaml) and then here.
# Like the other prebuilt images, the installer firmware ships with no
# OTA password and no API key so any Home Assistant can adopt it; Wi-Fi is set via Improv or
# the hotspot (the wrapper drops ssid/password). See docs/security.md to secure your own build.
wifi_ssid: ""
wifi_password: ""
ota_password: ""
