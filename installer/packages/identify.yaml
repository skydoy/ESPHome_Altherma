# Model identification for the web installer firmware (read-only).
# After boot the hub asks the indoor unit for its software ID (X10A 0x4C) and Micon ID (0x56),
# shows both, and suggests the matching confs/<model>.yaml from the table below.
# Unknown IDs: pick the model by hand, as before, and send the two IDs in a compatibility
# report so they can be added here. Add an entry only after it has been confirmed.
# (merged into the altherma_hub block of boards/base.yaml)
altherma_hub:
  identify_on_boot: true
  software_id_text_sensor: altherma_software_id
  micon_id_text_sensor: altherma_micon_id

text_sensor:
  - platform: template
    id: altherma_software_id
    name: "Controller Software ID"
    icon: mdi:identifier
    entity_category: diagnostic
    on_value:
      - component.update: altherma_suggested_model
      - component.update: altherma_model_check
  - platform: template
    id: altherma_micon_id
    name: "Controller Micon ID"
    icon: mdi:identifier
    entity_category: diagnostic
    on_value:
      - component.update: altherma_suggested_model
      - component.update: altherma_model_check
  - platform: template
    id: altherma_suggested_model
    name: "Suggested Model"
    icon: mdi:heat-pump-outline
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      struct Known { const char *software_id; const char *micon_id; const char *model; };
      static const Known KNOWN[] = {
        // BEGIN GENERATED known-ids (installer/models.yaml, run installer/gen_models.py)
        {"20007902", "ID0792", "erla_d_ebv_ebb_ebvz_11_16"},
        // END GENERATED known-ids
      };
      const std::string sw = id(altherma_software_id).has_state() ? id(altherma_software_id).state : "";
      const std::string mi = id(altherma_micon_id).has_state() ? id(altherma_micon_id).state : "";
      if (sw.empty() && mi.empty()) return {};
      for (const auto &k : KNOWN)
        if (sw == k.software_id && mi == k.micon_id) return std::string(k.model);
      return std::string("unknown");
  - platform: template
    id: altherma_model_check
    name: "Model Check"
    icon: mdi:check-decagram-outline
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      if (!id(altherma_suggested_model).has_state()) return {};
      const std::string s = id(altherma_suggested_model).state;
      if (s == "unknown") return std::string("Unknown IDs - pick your model on the installer site and send a report");
      if (s == "${altherma_model}") return std::string("OK - installed model matches");
      if (std::string("${altherma_model}") == "generic") return std::string("Model found - press Install the right firmware");
      return std::string("Different - press Install the right firmware (" + s + ")");

# "Install the right firmware": OTA from the installer site to the suggested model's firmware for
# this board (firmware/<board>/<model>/manifest.json). Only confirmed models have IDs in the table
# above (installer/models.yaml), and every confirmed model is built for every board, so the
# firmware exists. update.http_request has no templatable source in ESPHome 2026.10, but
# HttpRequestUpdate::set_source_url() works at run time: point the update entity at the model,
# check, then install. The model firmware keeps update.http_request on its own manifest.
button:
  - platform: template
    id: altherma_install_right_firmware
    name: "Install the right firmware"
    icon: mdi:download-circle-outline
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              if (!id(altherma_suggested_model).has_state()) return false;
              const std::string s = id(altherma_suggested_model).state;
              return s != "unknown" && s != "${altherma_model}";
          then:
            - logger.log:
                format: "Switching to the firmware for %s"
                args: ['id(altherma_suggested_model).state.c_str()']
            - lambda: |-
                id(update_http_request).set_source_url(
                    "https://skydoy.github.io/esphome-altherma/firmware/${altherma_board}/" +
                    id(altherma_suggested_model).state + "/manifest.json");
            - component.update: update_http_request
            - wait_until:
                condition:
                  lambda: |-
                    return id(update_http_request).update_info.firmware_url.find(
                        "/" + id(altherma_suggested_model).state + "/") != std::string::npos;
                timeout: 90s
            - if:
                condition:
                  lambda: |-
                    return id(update_http_request).update_info.firmware_url.find(
                        "/" + id(altherma_suggested_model).state + "/") != std::string::npos;
                then:
                  # force: install even when the version number is the same as this firmware's
                  - lambda: 'id(update_http_request).perform(true);'
                else:
                  - logger.log:
                      level: WARN
                      format: "Could not read the manifest for %s"
                      args: ['id(altherma_suggested_model).state.c_str()']
                  - lambda: |-
                      id(update_http_request).set_source_url(
                          "https://skydoy.github.io/esphome-altherma/firmware/${altherma_board}/${altherma_model}/manifest.json");
          else:
            - logger.log: "Nothing to install: model unknown or already installed"

# Board web page (http://esphome-altherma-….local/) with two extra buttons (report.js):
# "Instalar o firmware certo" / "Install the right firmware" when the model is known and not
# installed, and "Reportar a minha bomba" / "Report my heat pump", which opens the skydoy compatibility
# report form prefilled with the live Software ID, Micon ID and suggested model.
web_server:
  version: 3
  js_include: packages/report.js

# Automatic one-time compatibility report (see tools/report-worker/). On first boot, once the
# Software ID, Micon ID and suggested model have values (waits up to 10 min), the board POSTs the
# two IDs, suggested model, model check, board, firmware version and every non-internal sensor /
# text sensor reading to the altherma-reports Worker. No Wi-Fi name, IP, hostname
# or MAC is sent: device_hash is a salted SHA-256 of the MAC, only used to drop duplicates.
# report_sent is saved to flash only after an HTTP 2xx, so a failed send retries on the next boot.
sha256:

globals:
  - id: altherma_report_sent
    type: bool
    restore_value: yes
    initial_value: "false"

script:
  - id: altherma_auto_report
    mode: single
    then:
      - delay: 60s
      - wait_until:
          condition:
            lambda: |-
              return network::is_connected() && id(altherma_software_id).has_state() &&
                     id(altherma_micon_id).has_state() && id(altherma_suggested_model).has_state() &&
                     !id(altherma_software_id).state.empty() && !id(altherma_micon_id).state.empty();
          timeout: 9min
      - if:
          condition:
            lambda: 'return !id(altherma_report_sent) && id(altherma_software_id).has_state() && id(altherma_micon_id).has_state();'
          then:
            - http_request.post:
                url: https://altherma-reports.esphome-ac-report.workers.dev/
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["software_id"] = id(altherma_software_id).state;
                  root["micon_id"] = id(altherma_micon_id).state;
                  root["suggested_model"] = id(altherma_suggested_model).state;
                  if (id(altherma_model_check).has_state()) root["model_check"] = id(altherma_model_check).state;
                  root["board"] = "${altherma_board}";
                  root["firmware_version"] = "${altherma_version} (${altherma_model})";
                  esphome::sha256::SHA256 h;
                  h.init();
                  h.add(get_mac_address() + "|esphome-altherma-report-v1");
                  h.calculate();
                  char hex[65];
                  h.get_hex(hex);
                  root["device_hash"] = std::string(hex).substr(0, 32);
                  JsonObject r = root["readings"].to<JsonObject>();
                  int n = 0;
                  for (auto *s : App.get_sensors()) {
                    if (s->is_internal() || !s->has_state() || std::isnan(s->state) || ++n > 250) continue;
                    r[s->get_name().str()] = str_sprintf("%.*f %s", s->get_accuracy_decimals() < 0 ? 2 : s->get_accuracy_decimals(), s->state, s->get_unit_of_measurement_ref().c_str());
                  }
                  for (auto *t : App.get_text_sensors()) {
                    if (t->is_internal() || !t->has_state() || ++n > 250) continue;
                    r[t->get_name().str()] = t->state.substr(0, 80);
                  }
                on_response:
                  then:
                    - lambda: |-
                        ESP_LOGI("report", "Auto report: HTTP %d", response->status_code);
                        if (response->status_code >= 200 && response->status_code < 300) {
                          id(altherma_report_sent) = true;
                          global_preferences->sync();
                        }
                on_error:
                  then:
                    - logger.log: "Auto report failed, will retry on next boot"

esphome:
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return !id(altherma_report_sent);'
          then:
            - script.execute: altherma_auto_report
