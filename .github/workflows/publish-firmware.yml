name: Publish Firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-firmware:
    name: Build Firmware
    # Upstream (jjohnsen) release pipeline. Disabled in forks: skydoy/esphome-altherma publishes
    # its own releases and Pages from publish.yml, and a release made there would otherwise
    # trigger this workflow and publish-pages.yml, which would overwrite the fork's installer.
    if: github.repository == 'jjohnsen/esphome-altherma'
    uses: esphome/workflows/.github/workflows/build.yml@2026.10.2
    with:
      #### Modify below here to match your project ####
      files: |
        esphome-altherma-esp32.factory.yaml
        esphome-altherma-atoms3.factory.yaml
        esphome-altherma-esp8266.factory.yaml
      esphome-version: 2026.10.0
      combined-name: esphome-altherma
      #### Modify above here to match your project ####

      release-summary: ${{ github.event.release.body }}
      release-url: ${{ github.event.release.html_url }}
      release-version: ${{ github.event.release.tag_name }}

  upload-to-release:
    name: Upload to Release
    if: github.repository == 'jjohnsen/esphome-altherma'
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@2026.10.2
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}
