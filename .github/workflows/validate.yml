name: Validate
# Fast checks on every push and pull request (same idea as skydoy/ESPHome_AC and ESPHOME_Hunter):
# `esphome config` for every board x heat pump model (confs/*.yaml, including the generic
# identify-first one; seconds each) and the plain board configs, plus one real compile per board
# (generic model) with the firmware size check. The full board x model build only runs on release
# tags, in publish.yml.
# Pull requests also reject any commit in base..head whose git author is not
# exactly skydoy <25871317+skydoy@users.noreply.github.com>. That job does not publish.
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  config:
    name: config / ${{ matrix.board }} (all models)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp32-s3, atoms3, esp8266, m5stack]
    env:
      WRAPPER: installer/esphome-altherma-${{ matrix.board }}.installer.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: esphome config for every model, with its own OTA manifest URL
        run: |
          set -o pipefail
          for f in confs/*.yaml; do
            m=$(basename "$f" .yaml)
            echo "::group::${{ matrix.board }} / $m"
            esphome -s altherma_model "$m" config "$WRAPPER" | tee config.txt
            grep -q "source: https://skydoy.github.io/ESPHome_Altherma/firmware/${{ matrix.board }}/$m/manifest.json" config.txt \
              || { echo "::error::$WRAPPER ($m) does not update from firmware/${{ matrix.board }}/$m/manifest.json"; exit 1; }
            echo "::endgroup::"
          done
  board-configs:
    # The plain board files (what the Device Builder adopts), built from this checkout.
    name: config / ${{ matrix.file }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        file:
          - boards/esphome-altherma-esp32.yaml
          - boards/esphome-altherma-esp32-s3.yaml
          - boards/esphome-altherma-atoms3.yaml
          - boards/esphome-altherma-esp8266.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - run: esphome -s altherma_component_source ../components config ${{ matrix.file }} > /dev/null
  site:
    # installer/models.yaml is the single model list: the board's ID table (identify.yaml), the board
    # page buttons (report.js) and the site (index.html) are generated from it and must be up to date.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install pyyaml
      - run: python installer/gen_models.py --check
      - run: python installer/gen_models.py --matrix
  compile:
    # One real build per board (default model = generic, the firmware the web installer flashes
    # first) so compiler errors show up before a release, plus the firmware size check: fails when
    # the app image uses more than tools/firmware_size.py MAX_PERCENT (90%) of the app partition,
    # and lists what takes the most space (job summary).
    name: compile + size / ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp32-s3, atoms3, esp8266, m5stack]
    env:
      WRAPPER: installer/esphome-altherma-${{ matrix.board }}.installer.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-esphome-2026.10.1-${{ matrix.board }}
          restore-keys: pio-${{ runner.os }}-esphome-2026.10.1
      - run: pip install esphome==2026.10.1
      - run: esphome compile "$WRAPPER"
      - name: Firmware size check
        run: |
          set -o pipefail
          elf=$(esphome idedata "$WRAPPER" 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin)['prog_path'])")
          python tools/firmware_size.py --dir "$(dirname "$elf")" --label "${{ matrix.board }}/generic"
  packet-transport:
    # The optional boards/common/packet-transport.yaml (UDP value sharing for adopted builds) is not in
    # any prebuilt firmware, so check it here: config on every board with the generic model and with
    # erla_d_ebv_ebb_ebvz_11_16 (which has its own altherma_* ids), plus a real compile on ESP32 and
    # ESP8266 (the smallest RAM). Uses tools/packet-transport-check.yaml with a public test key.
    name: packet-transport / ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp32-s3, atoms3, esp8266]
    env:
      CHECK: tools/packet-transport-check.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: actions/cache@v6
        if: matrix.board == 'esp32' || matrix.board == 'esp8266'
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-esphome-2026.10.1-pt-${{ matrix.board }}
          restore-keys: pio-${{ runner.os }}-esphome-2026.10.1
      - run: pip install esphome==2026.10.1
      - name: esphome config
        run: |
          for m in generic erla_d_ebv_ebb_ebvz_11_16; do
            esphome -s pt_board ${{ matrix.board }} -s altherma_model "$m" config "$CHECK" > /dev/null
          done
      - name: esphome compile
        if: matrix.board == 'esp32' || matrix.board == 'esp8266'
        run: esphome -s pt_board ${{ matrix.board }} -s altherma_model erla_d_ebv_ebb_ebvz_11_16 compile "$CHECK"
  docs:
    # Bilingual docs site. Build and link-check only — this job does not deploy Pages.
    name: docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r requirements-docs.txt
      - run: python tools/build_docs.py
  commit-authors:
    # Git author of each commit in the pull request (base..head only).
    # Committer and Co-authored-by trailers are not checked. Skipped on push,
    # so commits that are already on the base branch are never judged here.
    # This job does not publish or deploy.
    name: commit authors
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch pull request base and head
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
      - name: Require author skydoy on base..head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/check_commit_authors.sh
