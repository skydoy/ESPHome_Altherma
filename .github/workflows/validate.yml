name: Validate
# Fast checks on every push and pull request (same idea as skydoy/ESPHome_AC and ESPHOME_Hunter):
# `esphome config` for every board x heat pump model (confs/*.yaml, including the generic
# identify-first one; seconds each) and the plain board configs, plus ONE real compile as a smoke test. The full board x model
# build only runs on release tags, in publish.yml.
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  config:
    name: config / ${{ matrix.board }} (all models)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32, esp32-s3, atoms3, esp8266, m5stack]
    env:
      WRAPPER: installer/esphome-altherma-${{ matrix.board }}.installer.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - name: esphome config for every model, with its own OTA manifest URL
        run: |
          set -o pipefail
          for f in confs/*.yaml; do
            m=$(basename "$f" .yaml)
            echo "::group::${{ matrix.board }} / $m"
            esphome -s altherma_model "$m" config "$WRAPPER" | tee config.txt
            grep -q "source: https://skydoy.github.io/ESPHome_Altherma/firmware/${{ matrix.board }}/$m/manifest.json" config.txt \
              || { echo "::error::$WRAPPER ($m) does not update from firmware/${{ matrix.board }}/$m/manifest.json"; exit 1; }
            echo "::endgroup::"
          done
  board-configs:
    # The plain board files (what the Device Builder adopts), built from this checkout.
    name: config / ${{ matrix.file }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        file:
          - boards/esphome-altherma-esp32.yaml
          - boards/esphome-altherma-esp32-s3.yaml
          - boards/esphome-altherma-atoms3.yaml
          - boards/esphome-altherma-esp8266.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install esphome==2026.10.1
      - run: esphome -s altherma_component_source ../components config ${{ matrix.file }} > /dev/null
  site:
    # installer/models.yaml is the single model list: the board's ID table (identify.yaml), the board
    # page buttons (report.js) and the site (index.html) are generated from it and must be up to date.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install pyyaml
      - run: python installer/gen_models.py --check
      - run: python installer/gen_models.py --matrix
  compile:
    # One real build (default board and model) so compiler errors show up before a release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-esphome-2026.10.1
      - run: pip install esphome==2026.10.1
      # Default model = generic, the firmware the web installer flashes first.
      - run: esphome compile installer/esphome-altherma-esp32.installer.yaml
