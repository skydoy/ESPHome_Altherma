substitutions:
  # Daikin Altherma model
  # Select a model from the confs/ directory (without .yaml):
  #
  # erga_eh_da_04_08           - ERGA D / EHV DA (4-8 kW)
  # erga_eh_e_ej_04_08         - ERGA E / EHV E/EJ (4-8 kW)
  # erla_d_ebsh_11_16_ech2o    - ERLA D / ECH2O (11-16 kW)
  # altherma_ehvh_ehvx_cb      - EHVH/EHVX CB
  # epra_d_etv_etb_etvz_14_18  - EPRA D / ETV/ETB/ETVZ
  # erla_d_ebv_ebb_ebvz_11_16  - ERLA D / EBV/EBB/EBVZ
  altherma_model: erga_eh_da_04_08
  # Bumped on each release; Device Builder / update-check compare against this.
  altherma_version: "2.6.2"
  altherma_verify_ssl: "true"

  # Default to GitHub for Take Control.
  # Override with "components" for local and factory builds.
  altherma_component_source: github://skydoy/ESPHome_Altherma@main

esphome:
  name: esphome-altherma
  friendly_name: ESPHome Altherma
  name_add_mac_suffix: true
  project:
    name: skydoy.esphome-altherma
    version: ${altherma_version}

logger:

api:
  custom_services: true

ota:
  - platform: esphome

wifi:
  # Fallback hotspot, named after the project like ESPHome_AC / ESPHome Hunter ("<project> Setup").
  ap:
    ssid: "ESPHome Altherma Setup"

captive_portal:

# Shared clock for update checks, energy day/month rollover, auto-update.
time:
  - platform: sntp
    id: altherma_sntp_time

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

external_components:
  - source: ${altherma_component_source}
    components: [altherma_hub]
    refresh: always    

altherma_hub:
  id: altherma_hub_1
  uart_id: uart_bus
  update_interval: 30s
  query_result_text_sensor: query_registry_result

text_sensor:
  - platform: template
    name: "Manual Query Registry Result"
    id: query_registry_result
    entity_category: diagnostic

packages:
  altherma_sensors: !include ../confs/${altherma_model}.yaml

  # Optional ESP diagnostics (ESP32 boards: common/diagnostics-esp32.yaml adds Internal Temperature).
  # M5Stack already includes diagnostics-esp32.yaml (display needs wifi_signal_sensor).
  # common_diagnostics: !include common/diagnostics.yaml