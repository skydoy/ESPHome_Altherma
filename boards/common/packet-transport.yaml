# Optional: share a few Altherma values with other ESPHome devices on the LAN, with no Home
# Assistant in between (ESPHome packet_transport over UDP broadcast, not encrypted).
# Made for an underfloor-heating controller that needs water/outdoor temperatures, compressor
# frequency and the fault state, but any ESPHome device can receive them.
#
# Not part of any prebuilt firmware: nothing is sent unless you add this package to your own
# (Device Builder) YAML:
#
#   packages:
#     altherma_udp: github://skydoy/ESPHome_Altherma/boards/common/packet-transport.yaml@main
#
# Works with every model in confs/ (including generic) and every board (ESP32 and ESP8266): it
# reads its own copy of the values from the standard X10A positions below, which are the same
# in every model file. The hub only queries each register once per cycle, so this adds no
# serial traffic when your model already reads these registers.
#
# Provider name = this device's name (esphome -> name, e.g. esphome-altherma-1a2b3c; with
# name_add_mac_suffix it is the name plus the MAC suffix shown in the Device Builder).
#
# What goes on the wire (broadcast ids, what the receiver uses as remote_id):
#   sensors
#     altherma_lwt          leaving water temperature after BUH (R2T), °C   0x61 +4 conv 105
#     altherma_return       inlet / return water temperature (R4T), °C      0x61 +8 conv 105
#     altherma_outdoor_temp outdoor air temperature (R1T), °C               0x20 +0 conv 105
#     altherma_comp_freq    compressor (INV) frequency, rps                 0x30 +0 conv 152
#     altherma_outdoor_error outdoor unit error code, raw byte (0 = none)   0x10 +5 conv 152
#     altherma_indoor_error  indoor unit error code, raw byte (0 = none)    0x60 +3 conv 152
#   binary sensors
#     altherma_fault        ON when either error code is not 0; OFF when both are 0
#
# packet_transport only carries numbers and on/off, not text, so the error codes travel as the
# raw byte. The 2-character code shown on the unit is
#   first char  = " ACEHFJLPU987654"[byte >> 4]
#   second char = "0123456789AHCJEF"[byte & 0x0F]
# e.g. 55 (0x37) = "E7", 147 (0x93) = "U3"; 0 = no error. Same table as the "Error Code" entities.
# The receiver should treat a value it has not received recently as unknown (see the docs).
#
# Sent in clear (no encryption, by design: the receiver can be a prebuilt firmware with no key).
# Anyone on your LAN can read these values, so only add this package on a network you trust.

substitutions:
  # How often the values are broadcast. The hub reads the heat pump every 30 s.
  altherma_udp_interval: 15s
  # UDP port, the same on both sides (ESPHome default 18511).
  altherma_udp_port: "18511"

udp:
  id: altherma_udp
  port: ${altherma_udp_port}

packet_transport:
  - platform: udp
    id: altherma_packet_transport
    udp_id: altherma_udp
    update_interval: ${altherma_udp_interval}
    sensors:
      - id: altherma_pt_lwt
        broadcast_id: altherma_lwt
      - id: altherma_pt_return
        broadcast_id: altherma_return
      - id: altherma_pt_outdoor_temp
        broadcast_id: altherma_outdoor_temp
      - id: altherma_pt_comp_freq
        broadcast_id: altherma_comp_freq
      - id: altherma_pt_outdoor_error
        broadcast_id: altherma_outdoor_error
      - id: altherma_pt_indoor_error
        broadcast_id: altherma_indoor_error
    binary_sensors:
      - id: altherma_pt_fault
        broadcast_id: altherma_fault

# No names: internal, never shown in Home Assistant or on the web page.
sensor:
  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_lwt
    register: 0x61
    offset: 4
    convid: 105
    datasize: 2
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_return
    register: 0x61
    offset: 8
    convid: 105
    datasize: 2
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_outdoor_temp
    register: 0x20
    offset: 0
    convid: 105
    datasize: 2
    accuracy_decimals: 1

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_comp_freq
    register: 0x30
    offset: 0
    convid: 152
    datasize: 1
    accuracy_decimals: 0

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_outdoor_error
    register: 0x10
    offset: 5
    convid: 152
    datasize: 1
    accuracy_decimals: 0

  - platform: altherma_hub
    altherma_hub_id: altherma_hub_1
    id: altherma_pt_indoor_error
    register: 0x60
    offset: 3
    convid: 152
    datasize: 1
    accuracy_decimals: 0

binary_sensor:
  - platform: template
    id: altherma_pt_fault
    # Unknown (not published) until both codes have been read at least once.
    lambda: |-
      float o = id(altherma_pt_outdoor_error).state;
      float i = id(altherma_pt_indoor_error).state;
      if (isnan(o) || isnan(i)) return {};
      return o != 0.0f || i != 0.0f;
