# Optional ESP diagnostics, for every board (ESP32 and ESP8266). On ESP32 boards use
# diagnostics-esp32.yaml instead: it includes this file and adds the chip's Internal Temperature
# (ESPHome's internal_temperature sensor does not exist on ESP8266).
# WiFi Signal / Uptime / IP / SSID use stable ids (wifi_signal_sensor, uptime_s, ip_addr,
# ssid_name) so the M5Stack board can include this package and drive its display from the
# same sensors — do not redefine those names on the board.
globals:
  - id: boot_count
    type: int
    restore_value: true
    initial_value: '0'

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(boot_count) += 1;

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: "diagnostic"

sensor:
  # Stable ids so boards that already need these (M5Stack display/graph) can include this
  # package instead of defining the same sensors again.
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: uptime
    name: "Uptime"
    id: uptime_s
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: template
    name: "Boot Count"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      return id(boot_count);
    entity_category: "diagnostic"

# Reset reason ("Power on", "Brownout", ...), same as ESPHome_AC / ESPHome Hunter. A brownout
# usually means the 5 V supply to the board is too weak or badly connected.
debug:
  update_interval: never

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: "diagnostic"

  # Project version (esphome: project: version), e.g. "2.6.1".
  - platform: template
    name: "Firmware Version"
    icon: mdi:tag-outline
    entity_category: "diagnostic"
    update_interval: 1h
    lambda: |-
      #ifdef ESPHOME_PROJECT_VERSION
      return std::string(ESPHOME_PROJECT_VERSION);
      #else
      return std::string("unknown");
      #endif

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr
      entity_category: "diagnostic"
    ssid:
      name: "WiFi SSID"
      id: ssid_name
      entity_category: "diagnostic"
    bssid:
      name: "WiFi BSSID"
      entity_category: "diagnostic"
    mac_address:
      name: "MAC Address"
      entity_category: "diagnostic"

button:
  - platform: restart
    name: "Restart"
    entity_category: "config"
  - platform: safe_mode
    name: "Restart (Safe Mode)"
    entity_category: "config"
