substitutions:
  altherma_component_source: ../components

packages:
  board: !include esphome-altherma-atoms3.yaml

esphome:
  # This will allow for project identification,
  # configuration and updates.
  project:
    name: skydoy.esphome-altherma
    version: dev # This will be replaced by the github workflows with the `release` version

# This should point to the public location of the yaml file that will be adopted.
# In this case it is the core yaml file that does not contain the extra things
# that are provided by this factory yaml file as the user does not need these once adopted.
dashboard_import:
  package_import_url: github://skydoy/ESPHome_Altherma/boards/esphome-altherma-atoms3.yaml@main

# Sets up the improv via serial client for Wi-Fi provisioning.
# Handy if your device has a usb port for the user to add credentials when they first get it.
improv_serial:

# Used to pull OTA updates
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    name: None
    id: update_http_request
    # Firmware published by skydoy/ESPHome_Altherma (GitHub Pages) for this board and the
    # altherma_model substitution (default from base.yaml).
    source: https://skydoy.github.io/ESPHome_Altherma/firmware/atoms3/${altherma_model}/manifest.json
