<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14">
  <title>X10A to ESP32 DevKit wiring</title>
  <rect width="640" height="330" rx="14" fill="#ffffff"/>
  <!-- X10A connector -->
  <text x="40" y="34" font-weight="700" font-size="16" fill="#1f2937">X10A (indoor unit main PCB)</text>
  <rect x="40" y="50" width="150" height="250" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <g font-weight="600" fill="#111827">
    <rect x="150" y="70" width="28" height="28" rx="3" fill="#fff" stroke="#374151"/><text x="164" y="89" text-anchor="middle">1</text>
    <rect x="150" y="115" width="28" height="28" rx="3" fill="#fff" stroke="#374151"/><text x="164" y="134" text-anchor="middle">2</text>
    <rect x="150" y="160" width="28" height="28" rx="3" fill="#fff" stroke="#374151"/><text x="164" y="179" text-anchor="middle">3</text>
    <rect x="150" y="205" width="28" height="28" rx="3" fill="#fff" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="164" y="224" text-anchor="middle" fill="#9ca3af">4</text>
    <rect x="150" y="250" width="28" height="28" rx="3" fill="#fff" stroke="#374151"/><text x="164" y="269" text-anchor="middle">5</text>
  </g>
  <g fill="#374151">
    <text x="56" y="89">5 V</text>
    <text x="56" y="134">TX (out)</text>
    <text x="56" y="179">RX (in)</text>
    <text x="56" y="224" fill="#9ca3af">not used</text>
    <text x="56" y="269">GND</text>
  </g>
  <!-- ESP32 board -->
  <text x="450" y="34" font-weight="700" font-size="16" fill="#1f2937">ESP32 DevKit</text>
  <rect x="450" y="50" width="150" height="250" rx="8" fill="#1e3a5f" stroke="#0f172a" stroke-width="2"/>
  <g font-weight="600" fill="#ffffff">
    <circle cx="466" cy="84" r="7" fill="#fbbf24"/><text x="482" y="89">5V / VIN</text>
    <circle cx="466" cy="129" r="7" fill="#fbbf24"/><text x="482" y="134">GPIO16 (RX)</text>
    <circle cx="466" cy="174" r="7" fill="#fbbf24"/><text x="482" y="179">GPIO17 (TX)</text>
    <circle cx="466" cy="264" r="7" fill="#fbbf24"/><text x="482" y="269">GND</text>
  </g>
  <!-- wires -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M178 84 H459" stroke="#dc2626"/>
    <path d="M178 129 C300 129 330 129 459 129" stroke="#16a34a"/>
    <path d="M178 174 C300 174 330 174 459 174" stroke="#2563eb"/>
    <path d="M178 264 H459" stroke="#111827"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="318" y="122">pump TX → ESP RX</text>
    <text x="318" y="167">ESP TX → pump RX</text>
    <text x="318" y="224" fill="#6b7280">pin 4: leave unconnected</text>
    <text x="318" y="314" fill="#6b7280">UART 9600 baud, 8 data bits, even parity, 1 stop bit (8E1)</text>
  </g>
</svg>
